<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Improx Data & Cloud Consulting | Data Entry, Scraping, Processing & Analytics</title>
    <meta name="description" content="Accurate, dependable data operations without the hiring headache. High-volume document digitization, web scraping, data cleaning, and dedicated virtual assistants." />
    <script>
      window.addEventListener('error', function(e) {
        console.error('CRITICAL WINDOW ERROR:', e);
        var errDiv = document.getElementById('vite-fatal-error');
        if (errDiv) {
          errDiv.style.display = 'block';
          errDiv.innerText = 'Runtime Error: ' + (e.message || e.error);
        }
      });
    </script>
  </head>
  <body style="margin: 0; background-color: #0b1120;">
    <div id="vite-fatal-error" style="display: none; padding: 20px; background: #991b1b; color: white; font-family: monospace; position: fixed; top: 0; left: 0; right: 0; z-index: 999999;"></div>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #0b1120; color: #f8fafc;">
        <div style="width: 48px; height: 48px; border: 3px solid #1e293b; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <h2 style="margin-top: 18px; font-size: 20px; font-weight: 700; letter-spacing: -0.01em;">IMPROX <span style="color: #60a5fa;">DATA</span></h2>
        <p style="margin-top: 6px; font-size: 13px; color: #94a3b8;">Loading Workspace...</p>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
